name: nox
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nox}
      POSTGRES_USER: ${POSTGRES_USER:-nox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nox-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    image: nox-api:local
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  worker:
    image: nox-api:local
    env_file: .env
    command: [python, -m, nox.worker]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  bot:
    profiles: [polling]
    image: nox-api:local
    env_file: .env
    command: [python, -m, nox.bot]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nox-web:local
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  nox-postgres:
  nox-redis:
