# docker compose -f docker-compose.yml -f infra/compose.production.yml up -d
# .env должен содержать production-настройки. Миграции выполните до запуска API.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    environment:
      NOX_MODE: production
    ports: !reset []
  worker:
    environment:
      NOX_MODE: production
  web:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    environment:
      NOX_DOMAIN: ${NOX_DOMAIN:?Set the public HTTPS Mini App domain}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - nox-caddy-data:/data
      - nox-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nox-caddy-data:
  nox-caddy-config:
