name: NOX quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nox
          POSTGRES_PASSWORD: nox-ci-only
          POSTGRES_DB: nox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U nox -d nox_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOX_MODE: demo
      NOX_DATABASE_URL: postgresql+asyncpg://nox:nox-ci-only@localhost:5432/nox_test
      NOX_REDIS_URL: redis://localhost:6379/0
      NOX_TEST_POSTGRES_URL: postgresql+asyncpg://nox:nox-ci-only@localhost:5432/nox_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check backend tests scripts
      - run: uv run ruff check backend tests scripts
      - run: uv run mypy backend/nox
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests -q
      - run: uv export --no-dev --no-emit-project --format requirements-txt --output-file /tmp/nox-runtime.txt
      - run: uv run pip-audit -r /tmp/nox-runtime.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: npm ci --prefix apps/web
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm run test:e2e --prefix apps/web
        env:
          NOX_MODE: demo
          NOX_DATABASE_URL: sqlite+aiosqlite:///./nox-e2e.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -f infra/api.Dockerfile -t nox-api:ci .
      - run: docker build -f infra/web.Dockerfile -t nox-web:ci .
