name: Ошибка
description: Воспроизводимая ошибка Astra без секретов и персональных данных
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите версию Astra, окружение и минимальный сценарий. Не прикладывайте токены или initData.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные журналы
