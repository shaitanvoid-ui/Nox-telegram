[project]
name = "nox-telegram"
version = "0.1.0"
description = "NOX — Next Generation Telegram Moderation & Community Management Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<0.136", "uvicorn[standard]>=0.41,<0.42",
  "sqlalchemy[asyncio]>=2.0.48,<2.1", "asyncpg>=0.31,<0.32",
  "aiosqlite>=0.22,<0.23", "alembic>=1.18,<1.19",
  "pydantic-settings>=2.14.2,<3", "redis>=7.3,<8", "aiogram>=3.26,<4",
  "httpx>=0.28,<0.29", "structlog>=25.5,<26", "prometheus-client>=0.24,<0.25"
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<0.16", "mypy>=1.19,<2", "pip-audit>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/nox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["backend/nox"]
strict = true
plugins = ["pydantic.mypy"]
